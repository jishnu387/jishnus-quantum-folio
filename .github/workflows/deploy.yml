name: Deploy Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build portfolio
        run: bun run build

      - name: Locate build output
        run: |
          echo "Searching for generated HTML files..."
          find . -maxdepth 4 -name index.html \
            -not -path './node_modules/*' \
            -not -path './.git/*'
          echo "Searching for build directories..."
          find . -maxdepth 3 -type d \
            \( -name dist -o -name build -o -name output \) \
            -not -path './node_modules/*'

      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
